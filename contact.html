<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – DORSOVA Rentals</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif}
    body{background:#fff8fb;color:#4a3b44;}

    /* Header */
    header{
      background:#ff8ab8;color:#fff;padding:24px;text-align:center;
      font-size:36px;font-weight:700;border-bottom:4px solid #e66ca4;
      letter-spacing:1px; font-family:"Playfair Display", serif;
    }

    /* Navigation Under Header */
    nav{
      text-align:center;
      padding:14px 0;
      background:#fff;
      border-bottom:2px solid #ffd6e6;
    }
    nav a{
      margin:0 18px;
      color:#b23e6b;
      font-size:18px;
      font-weight:600;
      text-decoration:none;
      padding:8px 18px;
      border-radius:22px;
      border:2px solid #ffd6e6;
      transition:.3s;
    }
    nav a:hover{
      background:#ffedf5;
      color:#ff4d88;
    }

    /* Contact Form Container */
    .container{
      width:90%;max-width:850px;margin:40px auto;
      background:#fff;border:2px solid #ffd6e6;border-radius:16px;
      padding:35px;line-height:1.6;font-size:17px;
      box-shadow:0 6px 18px rgba(255,182,216,.45);
    }

    h2{
      font-size:30px;color:#b23e6b;
      margin-bottom:15px;font-family:"Playfair Display", serif;
    }

    label{font-weight:500;margin-top:12px;display:block;color:#444;}
    input, textarea{
      width:100%;padding:12px;margin-top:6px;
      border:2px solid #ffd6e6;border-radius:10px;
      outline:none;background:#fff8fb;
    }
    input:focus, textarea:focus{border-color:#ff8ab8;}

    textarea{height:140px;resize:none;}

    .send-btn{
      margin-top:22px;background:#ff8ab8;color:#fff;
      padding:14px 26px;border:none;border-radius:25px;
      font-size:18px;font-weight:600;cursor:pointer;transition:.3s;
      display:block;margin-left:auto;margin-right:auto;
    }
    .send-btn:hover{background:#e66ca4;transform:translateY(-2px);}
  </style>
</head>

<body>

<header>Contact DORSOVA</header>

<!-- Navigation -->
<nav>
  <a href="e commerce.html">Home</a>
  <a href="about.html">About</a>
  <a href="contact.html" style="background:#ffedf5;color:#ff4d88;">Contact</a>
</nav>

<div class="container">
  <h2>Say Hello ✨</h2>
  <p>Have questions or want to book a dress? We’d love to hear from you 💗</p>

  <form>
    <label>Full Name *</label>
    <input type="text" required>

    <label>Email *</label>
    <input type="email" required>

    <label>Phone *</label>
    <input type="text" required>

    <label>Your Message *</label>
    <textarea placeholder="Tell us about your event, styles you love..."></textarea>

    <button class="send-btn">Send Message</button>
  </form>
</div>

</body>
</html>
